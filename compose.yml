services:
  assoplus:
    build:
      target: production
      context: .
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@assoplus-db:5432/postgres
    ports:
      - "80:80"
    depends_on:
      - assoplus-db
  assoplus-db:
    image: postgres:12
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
