services:
  assoplus:
    build:
      target: development
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@assoplus-db:5432/assoplus
    volumes:
      - .:/app
    ports:
      - "3000:3000"
      - "5555:5555"
    depends_on:
      assoplus-db:
        condition: service_healthy
      assoplus-mailpit:
        condition: service_healthy
  assoplus-db:
    image: postgres:12
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: assoplus
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 5s
      timeout: 2s
      retries: 20
  assoplus-mailpit:
    image: axllent/mailpit
    ports:
      - 8025:8025
      - 1025:1025
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
